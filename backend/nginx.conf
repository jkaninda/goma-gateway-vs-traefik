# Static backend serving the okapi-example payloads.
# Purpose: a backend that is never the bottleneck, so the benchmark measures the gateway.
worker_processes auto;
worker_rlimit_nofile 1048576;
error_log /dev/stderr error;
events { worker_connections 65535; multi_accept on; }
http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_requests 1000000;
  keepalive_timeout 120s;
  server {
    listen 8080 reuseport backlog=65535;
    default_type application/json;
    root /usr/share/nginx/html;
    location = /api/books   { try_files /api/books/index.json =404; }
    location = /api/books/1 { try_files /api/books/1.json =404; }
  }
}
